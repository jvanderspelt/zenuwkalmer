<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZenuwKalmer • Paniek & Angst</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">
  <style>
    body { font-family: system-ui, sans-serif; }
    .header { background: linear-gradient(to right, #0ea5a6, #14b8a6); }
    .card { background: white; box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.05); }
  </style>
</head>
<body class="bg-slate-50 min-h-screen">

<header class="header text-white py-6 shadow-md">
  <div class="max-w-2xl mx-auto px-6 flex items-center gap-3">
    <div class="w-12 h-12 bg-white rounded-3xl flex items-center justify-center text-4xl">🧠</div>
    <div>
      <span class="font-bold text-3xl">Paniek & Angst</span>
      <p class="text-xs opacity-90">ZenuwKalmer - door Joris</p>
    </div>
  </div>
</header>

<div class="max-w-2xl mx-auto px-6 pt-8">

  <div class="flex gap-5 mb-10">
    <img src="https://files.catbox.moe/0v4r2k.jpg" alt="Joris" class="w-28 h-28 rounded-3xl object-cover border-4 border-white shadow-xl">
    <div>
      <h1 class="text-3xl font-bold">Hallo, ik ben Joris</h1>
      <p class="text-teal-600">Ik heb het zelf overwonnen</p>
    </div>
  </div>

  <!-- Navigatie -->
  <div class="grid grid-cols-4 gap-2 bg-white p-1 rounded-3xl shadow mb-10">
    <button onclick="showTab(0)" class="tab py-3 rounded-3xl font-medium">Home</button>
    <button onclick="showTab(1)" class="tab py-3 rounded-3xl font-medium">Verhaal</button>
    <button onclick="showTab(2)" class="tab py-3 rounded-3xl font-medium tab-active">Oefeningen</button>
    <button onclick="showTab(3)" class="tab py-3 rounded-3xl font-medium bg-amber-500 text-white">Premium</button>
  </div>

  <!-- OEFENINGEN TAB (hoofdscherm) -->
  <div id="tab-2" class="tab-content">
    <h2 class="text-2xl font-bold mb-6">Oefeningen</h2>
   
    <div onclick="showExercise(1)" class="card p-6 rounded-3xl cursor-pointer mb-4 hover:shadow-md">
      <h3 class="font-semibold text-lg">🌊 Floating Techniek - Claire Weekes</h3>
      <p class="text-teal-600 text-sm">De belangrijkste techniek om angst los te laten</p>
    </div>

    <div onclick="showExercise(2)" class="card p-6 rounded-3xl cursor-pointer mb-4 hover:shadow-md">
      <h3 class="font-semibold text-lg">🧭 AWARE Methode</h3>
      <p class="text-teal-600 text-sm">Accept • Watch • Act • Repeat • Expect</p>
    </div>

    <div onclick="showExercise(3)" class="card p-6 rounded-3xl cursor-pointer mb-4 hover:shadow-md">
      <h3 class="font-semibold text-lg">🫁 4-7-8 Ademhaling</h3>
    </div>

    <div onclick="showExercise(4)" class="card p-6 rounded-3xl cursor-pointer hover:shadow-md">
      <h3 class="font-semibold text-lg">🌍 5-4-3-2-1 Aarden</h3>
    </div>
  </div>

</div>

<!-- Modal voor oefening -->
<div id="exercise-modal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50">
  <div class="bg-white max-w-2xl w-full mx-4 rounded-3xl max-h-[90vh] overflow-auto">
    <div class="p-6">
      <button onclick="closeModal()" class="text-gray-500 mb-4">← Terug</button>
      <div id="modal-content" class="prose"></div>
    </div>
  </div>
</div>

<script>
function showTab(n) {
  document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden'));
  document.getElementById('tab-' + n).classList.remove('hidden');
}

function showExercise(id) {
  const modal = document.getElementById('exercise-modal');
  const content = document.getElementById('modal-content');

  if (id === 1) {
    content.innerHTML = `
      <h2 class="text-2xl font-bold mb-4">🌊 Floating Techniek - Claire Weekes</h2>
      <p class="text-slate-700 leading-relaxed">Floating betekent dat je de angst volledig toelaat zonder weerstand.</p>
      <p class="text-slate-700 leading-relaxed mt-4">Stel je voor dat je een blaadje bent op een rivier. Je hoeft niet te zwemmen of te vechten tegen de stroom. Je laat je gewoon mee drijven.</p>
      <p class="text-slate-700 leading-relaxed mt-4">Zeg tegen jezelf:<br><strong>"Ik laat dit er zijn. Ik vecht er niet tegen. Ik drijf erdoorheen."</strong></p>
      <p class="mt-6 text-teal-600 font-medium">Dit is één van de krachtigste technieken om de angstloop te doorbreken.</p>
    `;
  } else if (id === 2) {
    content.innerHTML = `<h2 class="text-2xl font-bold mb-4">🧭 AWARE Methode</h2><p class="text-slate-700">Accept • Watch • Act normaal • Repeat • Expect ups & downs</p>`;
  } else {
    content.innerHTML = `<h2 class="text-2xl font-bold">Oefening gestart</h2><p class="mt-4">Premium gebruikers krijgen hier audio-begeleiding met mijn stem.</p>`;
  }

  modal.classList.remove('hidden');
}

function closeModal() {
  document.getElementById('exercise-modal').classList.add('hidden');
}

// Start op Oefeningen tab
showTab(2);
</script>
</body>
</html>
